# Babeltrace2 interval-matching model for MPI
# gpu_aware (int8): 1 = at least one buffer pointer resolved to a GPU
#                       allocation (L0 device/shared, CUDA device/managed,
#                       HIP device) at call entry time.
#                   0 = all buffer pointers are host memory (CPU-only call).
---
:matching:
  :event_class_name: true
  :hostname: true
  :vpid: true
  :vtid: true
:interval_fields:
  :gpu_aware:
    :type: int8_t
    :default: 0
